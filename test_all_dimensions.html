                medium: "你的虐待倾向处于中等水平（34-66%），在大多数情况下能够同情他人的痛苦，但在某些情况下也可能感到一丝幸灾乐祸。你不会主动伤害他人，但也可能不会积极地帮助处于困境中的人。",
                high: "你的虐待倾向处于较高水平（67-100%），喜欢看到他人受苦，甚至会主动制造痛苦来满足自己的快感。你对他人的痛苦缺乏同情心，反而从中获得乐趣。"

                medium: "你的自我中心程度处于中等水平（34-66%），能够在关注自己和关注他人之间找到平衡。你会考虑他人的感受，但也不会忽视自己的需求和利益。",
                high: "你的自我中心程度处于较高水平（67-100%），总是优先考虑自己的需求和感受，很少关心他人的想法。你认为自己的需求比他人的更重要，经常将自己的意愿强加给他人。"

                low: "你的恶意程度处于较低水平（0-33%），是一个非常善良和友善的人，总是尽量帮助他人，避免与他人发生冲突。你相信人性本善，愿意相信他人的善意。",

        // 模拟用户分数
        let userScores = {};

        // 控制台日志输出
        function log(message) {
            const console = document.getElementById('console-output');
            console.innerHTML += message + '<br>';
            console.scrollTop = console.scrollHeight;
        }

        // 获取等级
        function getLevel(score) {
            if (score < 33) return 'low';
            if (score < 66) return 'medium';
            return 'high';
        }

        // 模拟低分数
        function simulateLowScores() {
            log('=== 模拟低分数 (10-30%) ===');
            userScores = {
                selfInterest: 15,
                greed: 20,
                machiavellianism: 12,
                moralDisengagement: 25,
                narcissism: 18,
                psychologicalEntitlement: 22,
                psychopathy: 16,
                sadism: 28,
                selfCentered: 14,
                malevolence: 24
            };
            updateAllDimensions();
        }

        // 模拟中分数
        function simulateMediumScores() {
            log('=== 模拟中分数 (35-65%) ===');
            userScores = {
                selfInterest: 45,
                greed: 55,
                machiavellianism: 38,
                moralDisengagement: 62,
                narcissism: 42,
                psychologicalEntitlement: 58,
                psychopathy: 48,
                sadism: 52,
                selfCentered: 35,
                malevolence: 60
            };
            updateAllDimensions();
        }

        // 模拟高分数
        function simulateHighScores() {
            log('=== 模拟高分数 (70-95%) ===');
            userScores = {
                selfInterest: 85,
                greed: 92,
                machiavellianism: 78,
                moralDisengagement: 88,
                narcissism: 75,
                psychologicalEntitlement: 90,
                psychopathy: 82,
                sadism: 95,
                selfCentered: 73,
                malevolence: 87

        }

        // 更新所有维度
        function updateAllDimensions() {
            log('开始更新所有维度...');
            
            // 使用与index.html相同的updateDimensionUI函数逻辑
            updateDimensionUI('selfInterest', '利己主义');
            updateDimensionUI('greed', '贪婪');
            updateDimensionUI('machiavellianism', '马基雅维利主义', 'machiavellianism-detail');
            updateDimensionUI('moralDisengagement', '道德推脱');
            updateDimensionUI('narcissism', '自恋', 'narcissism-detail');
            updateDimensionUI('psychologicalEntitlement', '心理权利');
            updateDimensionUI('psychopathy', '精神变态', 'psychopathy-detail');
            updateDimensionUI('sadism', '施虐倾向');
            updateDimensionUI('selfCentered', '自我为中心');
            updateDimensionUI('malevolence', '恶毒倾向');
            
            log('所有维度更新完成！');
        }

        // 更新维度UI（复制自index.html的修复版本）
        function updateDimensionUI(dimensionKey, dimensionName, elementIdPrefix = null) {
            log(`=== 更新维度: ${dimensionKey} ===`);
            
            const prefix = elementIdPrefix || dimensionKey;
            const kebabCasePrefix = prefix.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
            
            log(`使用前缀: ${prefix}, kebabCase: ${kebabCasePrefix}`);
            
            const scoreElement = document.getElementById(`${kebabCasePrefix}-score`);
            const barElement = document.getElementById(`${kebabCasePrefix}-bar`);
            const analysisElement = document.getElementById(`${dimensionKey}-analysis`);
            
            log(`查找元素: score=${!!scoreElement}, bar=${!!barElement}, analysis=${!!analysisElement}`);
            
            if (scoreElement) {
                const score = userScores[dimensionKey];
                scoreElement.textContent = `${score}%`;
                log(`✅ 分数更新成功: ${dimensionKey} = ${score}%`);
            } else {
                log(`❌ 分数元素未找到: ${kebabCasePrefix}-score`);
            }
            
            if (barElement) {
                const score = userScores[dimensionKey];
                barElement.style.width = `${score}%`;
                log(`✅ 进度条更新成功: ${dimensionKey} = ${score}%`);
            } else {
                log(`❌ 进度条元素未找到: ${kebabCasePrefix}-bar`);
            }
            
            if (analysisElement) {
                const score = userScores[dimensionKey];
                const level = getLevel(score);
                analysisElement.textContent = analysisTexts[dimensionKey][level];
                log(`✅ 分析文本更新成功: ${dimensionKey} - ${level}级`);
            } else {
                log(`❌ 分析元素未找到: ${dimensionKey}-analysis`);
            }
        }
