<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑暗三角人格测试 - 分数显示测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#333333',
                        secondary: '#1a1a1a',
                        accent: '#8A2BE2',
                        'accent-light': '#9370DB',
                        'accent-dark': '#4B0082',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .bg-gradient-purple {
                background: linear-gradient(135deg, #8A2BE2 0%, #4B0082 100%);
            }
            .text-shadow {
                text-shadow: 0 0 10px rgba(138, 43, 226, 0.7);
            }
            .border-glow {
                box-shadow: 0 0 5px rgba(138, 43, 226, 0.7);
            }
        }
    </style>
    <style>
        body {
            background-color: #121212;
            color: #F8F9FA;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .radar-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        .btn-primary {
            background: linear-gradient(135deg, #8A2BE2 0%, #4B0082 100%);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen bg-gray-900 text-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8 text-accent">黑暗三角人格测试 - 分数显示测试</h1>
        
        <div class="bg-secondary bg-opacity-80 p-6 rounded-lg shadow-lg mb-8">
            <h2 class="text-xl font-semibold mb-4 text-accent">详细维度分析</h2>
            
            <!-- 利己主义 -->
            <div class="mb-6">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-medium">利己主义</h3>
                    <div class="flex items-center">
                        <span id="self-interest-score" class="mr-2">0%</span>
                        <div class="w-32 bg-gray-700 rounded-full h-2">
                            <div id="self-interest-bar" class="bg-accent h-2 rounded-full" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                <p id="self-interest-analysis" class="text-sm text-gray-300">
                    <!-- 分析内容将通过JavaScript动态插入 -->
                </p>
            </div>
            
            <!-- 心理权利 -->
            <div class="mb-6">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-medium">心理权利</h3>
                    <div class="flex items-center">
                        <span id="psychological-entitlement-score" class="mr-2">0%</span>
                        <div class="w-32 bg-gray-700 rounded-full h-2">
                            <div id="psychological-entitlement-bar" class="bg-accent h-2 rounded-full" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                <p id="psychological-entitlement-analysis" class="text-sm text-gray-300">
                    <!-- 分析内容将通过JavaScript动态插入 -->
                </p>
            </div>
            
            <!-- 自我为中心 -->
            <div class="mb-6">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-medium">自我为中心</h3>
                    <div class="flex items-center">
                        <span id="self-centered-score" class="mr-2">0%</span>
                        <div class="w-32 bg-gray-700 rounded-full h-2">
                            <div id="self-centered-bar" class="bg-accent h-2 rounded-full" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                <p id="self-centered-analysis" class="text-sm text-gray-300">
                    <!-- 分析内容将通过JavaScript动态插入 -->
                </p>
            </div>
            
            <!-- 贪婪 -->
            <div class="mb-6">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-medium">贪婪</h3>
                    <div class="flex items-center">
                        <span id="greed-score" class="mr-2">0%</span>
                        <div class="w-32 bg-gray-700 rounded-full h-2">
                            <div id="greed-bar" class="bg-accent h-2 rounded-full" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
                <p id="greed-analysis" class="text-sm text-gray-300">
                    <!-- 分析内容将通过JavaScript动态插入 -->
                </p>
            </div>
        </div>
        
        <div class="text-center">
            <button id="test-btn" class="btn-primary">测试分数显示</button>
        </div>
    </div>

    <script>
        // 模拟用户分数数据
        const userScores = {
            selfInterest: 75,
            psychologicalEntitlement: 62,
            selfCentered: 88,
            greed: 45
        };
        
        // 模拟分析文本
        const analysisTexts = {
            selfInterest: {
                low: "你的利己主义倾向较低，你更倾向于考虑他人的需求和感受。",
                medium: "你有中等程度的利己主义倾向，在关注自身利益的同时也会考虑他人。",
                high: "你的利己主义倾向较高，在决策时更优先考虑自身利益。"
            },
            psychologicalEntitlement: {
                low: "你对自己的权利要求较低，不太会认为自己应该得到特殊待遇。",
                medium: "你对自己的权利有适度的认知，在合理范围内争取自己的权益。",
                high: "你有较强的心理权利感，认为自己应该得到特殊待遇和更多的关注。"
            },
            selfCentered: {
                low: "你不太以自我为中心，能够很好地考虑他人的观点和感受。",
                medium: "你在关注自我和关注他人之间取得了一定的平衡。",
                high: "你比较以自我为中心，在思考和行动时更多地从自身角度出发。"
            },
            greed: {
                low: "你对物质财富的欲望较低，更注重非物质层面的满足。",
                medium: "你对物质有适度的追求，能够在满足基本需求的同时保持平衡。",
                high: "你有较强的贪婪倾向，对物质财富有较高的追求。"
            }
        };
        
        // 获取等级（低、中、高）
        function getLevel(score) {
            if (score < 33) return 'low';
            if (score < 66) return 'medium';
            return 'high';
        }
        
        // 更新维度UI
        function updateDimensionUI(dimensionKey, dimensionName) {
            // 将驼峰式命名转换为连字符命名
            const kebabCasePrefix = dimensionKey.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
            const scoreElement = document.getElementById(`${kebabCasePrefix}-score`);
            const barElement = document.getElementById(`${kebabCasePrefix}-bar`);
            const analysisElement = document.getElementById(`${kebabCasePrefix}-analysis`);
            
            if (scoreElement && barElement && analysisElement) {
                const score = userScores[dimensionKey];
                scoreElement.textContent = `${score}%`;
                barElement.style.width = `${score}%`;
                
                // 根据分数获取分析文本
                const level = getLevel(score);
                analysisElement.textContent = analysisTexts[dimensionKey][level];
            } else {
                console.error(`元素未找到: ${kebabCasePrefix}-score, ${kebabCasePrefix}-bar, ${kebabCasePrefix}-analysis`);
            }
        }
        
        // 测试按钮点击事件
        document.getElementById('test-btn').addEventListener('click', function() {
            updateDimensionUI('selfInterest', '利己主义');
            updateDimensionUI('psychologicalEntitlement', '心理权利');
            updateDimensionUI('selfCentered', '自我为中心');
            updateDimensionUI('greed', '贪婪');
            
            alert('分数显示测试完成！');
        });
    </script>
</body>
</html>
