<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优化计分体系测试 - 黑暗三角人格测试</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        h1 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .test-section {
            margin: 30px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .test-section h2 {
            color: #ffd700;
            margin-bottom: 20px;
            text-align: center;
        }
        .score-display {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .score-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .score-item h3 {
            margin: 0 0 10px 0;
            color: #ffd700;
            font-size: 1.1em;
        }
        .score-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #00ff88;
        }
        .test-controls {
            text-align: center;
            margin: 20px 0;
        }
        .btn {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            margin: 0 10px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }
        .test-results {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .test-results h3 {
            color: #ffd700;
            margin-bottom: 15px;
        }
        .validation-status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-weight: bold;
        }
        .validation-pass {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid #00ff88;
            color: #00ff88;
        }
        .validation-fail {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            color: #ff4444;
        }
        .score-breakdown {
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            font-size: 0.9em;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>优化计分体系测试验证</h1>
        
        <div class="test-section">
            <h2>新计分体系验证 (0%-100%)</h2>
            <div class="test-controls">
                <button class="btn" onclick="testAllLowScores()">测试全低分模式</button>
                <button class="btn" onclick="testAllHighScores()">测试全高分模式</button>
                <button class="btn" onclick="testMixedScores()">测试混合模式</button>
                <button class="btn" onclick="testBoundaryConditions()">测试边界条件</button>
            </div>
            
            <div id="test-results" class="test-results" style="display: none;">
                <h3>测试结果</h3>
                <div id="validation-output"></div>
            </div>
        </div>

        <div class="test-section">
            <h2>分数范围验证</h2>
            <div class="score-display" id="score-display">
                <!-- 分数将在这里显示 -->
            </div>
        </div>

        <div class="test-section">
            <h2>详细计算过程</h2>
            <div id="calculation-details" class="score-breakdown">
                <!-- 详细计算过程将在这里显示 -->
            </div>
        </div>
    </div>

    <script src="optimized_scoring.js"></script>
    <script>
        let scoringSystem = new DarkTriangleScoringSystem();
        
        function displayScores(testName, scores, details) {
            document.getElementById('test-results').style.display = 'block';
            
            // 显示分数
            let scoreHtml = `<h3>${testName}</h3>`;
            for (let dimension in scores) {
                scoreHtml += `
                    <div class="score-item">
                        <h3>${getDimensionName(dimension)}</h3>
                        <div class="score-value">${scores[dimension].toFixed(1)}%</div>
                    </div>
                `;
            }
            document.getElementById('score-display').innerHTML = scoreHtml;
            
            // 显示详细计算过程
            document.getElementById('calculation-details').textContent = details;
            
            // 验证分数范围
            validateScoreRange(scores);
        }
        
        function getDimensionName(dimension) {
            const names = {
                selfInterest: '利己主义',
                greed: '贪婪',
                machiavellianism: '马基雅维利主义',
                moralDisengagement: '道德脱离',
                narcissism: '自恋',
                psychologicalEntitlement: '心理权利感',
                psychopathy: '精神病态',
                sadism: '虐待倾向',
                selfCentered: '自我中心',
                malevolence: '恶意',
                darkTriadTotal: '黑暗三角总分'
            };
            return names[dimension] || dimension;
        }
        
        function validateScoreRange(scores) {
            let validationHtml = '<h3>分数范围验证</h3>';
            let allPassed = true;
            
            for (let dimension in scores) {
                let score = scores[dimension];
                let status = '';
                
                if (score >= 0 && score <= 100) {
                    status = `<span class="validation-pass">✓ ${getDimensionName(dimension)}: ${score.toFixed(1)}% (在有效范围内)</span>`;
                } else {
                    status = `<span class="validation-fail">✗ ${getDimensionName(dimension)}: ${score.toFixed(1)}% (超出范围!)</span>`;
                    allPassed = false;
                }
                
                validationHtml += `<div class="validation-status">${status}</div>`;
            }
            
            if (allPassed) {
                validationHtml += '<div class="validation-status validation-pass"><strong>✓ 所有分数都在有效范围内 (0%-100%)</strong></div>';
            } else {
                validationHtml += '<div class="validation-status validation-fail"><strong>✗ 发现超出范围的分数!</strong></div>';
            }
            
            document.getElementById('validation-output').innerHTML = validationHtml;
        }
        
        function testAllLowScores() {
            // 模拟全选最低分 (1分)
            let mockAnswers = new Array(60).fill(1); // 假设60道题
            let result = scoringSystem.calculateNormalizedScores(mockAnswers);
            displayScores('全低分模式测试 (所有答案选1分)', result.scores, result.details);
        }
        
        function testAllHighScores() {
            // 模拟全选最高分 (5分)
            let mockAnswers = new Array(60).fill(5); // 假设60道题
            let result = scoringSystem.calculateNormalizedScores(mockAnswers);
            displayScores('全高分模式测试 (所有答案选5分)', result.scores, result.details);
        }
        
        function testMixedScores() {
            // 模拟混合分数
            let mockAnswers = [];
            for (let i = 0; i < 60; i++) {
                mockAnswers.push(Math.floor(Math.random() * 5) + 1); // 1-5分随机
            }
            let result = scoringSystem.calculateNormalizedScores(mockAnswers);
            displayScores('混合模式测试 (随机1-5分)', result.scores, result.details);
        }
        
        function testBoundaryConditions() {
            // 测试边界条件
            let testCases = [
                { name: '最低边界测试', answers: new Array(60).fill(1) },
                { name: '最高边界测试', answers: new Array(60).fill(5) },
                { name: '中间值测试', answers: new Array(60).fill(3) }
            ];
            
            let results = [];
            testCases.forEach(testCase => {
                let result = scoringSystem.calculateNormalizedScores(testCase.answers);
                results.push({
                    name: testCase.name,
                    scores: result.scores,
                    details: result.details
                });
            });
            
            // 显示所有边界测试结果
            let combinedHtml = '<h3>边界条件测试结果</h3>';
            results.forEach(result => {
                combinedHtml += `<h4>${result.name}</h4>`;
                for (let dimension in result.scores) {
                    combinedHtml += `<p>${getDimensionName(dimension)}: ${result.scores[dimension].toFixed(1)}%</p>`;
                }
            });
            
            document.getElementById('validation-output').innerHTML = combinedHtml;
            document.getElementById('calculation-details').textContent = results.map(r => r.details).join('\n---\n');
            document.getElementById('score-display').innerHTML = '<p style="text-align: center; color: #ffd700;">边界条件测试完成，查看下方详细结果</p>';
            document.getElementById('test-results').style.display = 'block';
        }
        
        // 页面加载时自动运行一次测试
        window.onload = function() {
            console.log('优化计分体系测试页面已加载');
            console.log('计分系统已初始化:', scoringSystem);
        };
    </script>
</body>
</html>
