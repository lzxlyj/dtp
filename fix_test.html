<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修复测试 - 黑暗三角人格测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .result { margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 3px; }
        .error { color: red; }
        .success { color: green; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>修复测试 - 黑暗三角人格测试结果分析</h1>
    
    <!-- 模拟HTML结构 -->
    <div class="test-section">
        <h2>当前HTML结构（来自index.html）</h2>
        
        <!-- 马基雅维利主义 -->
        <div>
            <h3>马基雅维利主义</h3>
            <div>分数: <span id="machiavellianism-detail-score">0%</span></div>
            <div>进度条: <div id="machiavellianism-detail-bar" style="width: 0%"></div></div>
            <div>分析: <span id="machiavellianism-detail-analysis"></span></div>
            <div>详细分析: <span id="machiavellianism-detail-percentage-text"></span></div>
            <div>建议: <ul id="machiavellianism-detail-suggestions"></ul></div>
        </div>
        
        <!-- 自恋 -->
        <div>
            <h3>自恋</h3>
            <div>分数: <span id="narcissism-detail-score">0%</span></div>
            <div>进度条: <div id="narcissism-detail-bar" style="width: 0%"></div></div>
            <div>分析: <span id="narcissism-detail-analysis"></span></div>
            <div>详细分析: <span id="narcissism-detail-percentage-text"></span></div>
            <div>建议: <ul id="narcissism-detail-suggestions"></ul></div>
        </div>
        
        <!-- 精神变态 -->
        <div>
            <h3>精神变态</h3>
            <div>分数: <span id="psychopathy-detail-score">0%</span></div>
            <div>进度条: <div id="psychopathy-detail-bar" style="width: 0%"></div></div>
            <div>分析: <span id="psychopathy-detail-analysis"></span></div>
            <div>详细分析: <span id="psychopathy-detail-percentage-text"></span></div>
            <div>建议: <ul id="psychopathy-detail-suggestions"></ul></div>
        </div>
    </div>
    
    <div class="test-section">
        <h2>测试当前逻辑</h2>
        <button onclick="testCurrentLogic()">测试当前逻辑</button>
        <button onclick="testFixedLogic()">测试修复逻辑</button>
        <button onclick="clearResults()">清除结果</button>
        
        <div id="test-results"></div>
    </div>

    <script>
        // 模拟userScores数据
        const userScores = {
            machiavellianism: 75,
            narcissism: 60,
            psychopathy: 45,
            selfInterest: 55,
            greed: 40,
            moralDisengagement: 50,
            psychologicalEntitlement: 65,
            sadism: 30,
            selfCentered: 35,
            malevolence: 25,
            darkTriadTotal: 60
        };

        // 分析文本
        const analysisTexts = {
            machiavellianism: {
                low: '您的马基雅维利主义倾向较低，表明您通常以诚实和直接的方式与人交往。',
                medium: '您的马基雅维利主义倾向中等，表明您在人际交往中具有一定的策略性。',
                high: '您的马基雅维利主义倾向较高，表明您在人际交往中倾向于使用策略和操控手段。'
            },
            narcissism: {
                low: '您的自恋程度较低，表明您通常保持谦逊的态度。',
                medium: '您的自恋程度中等，表明您具有适度的自信。',
                high: '您的自恋程度较高，表明您倾向于自我中心和寻求关注。'
            },
            psychopathy: {
                low: '您的精神变态特质较低，表明您具有正常的情感反应和同理心。',
                medium: '您的精神变态特质中等，表明您在情感反应方面处于正常范围。',
                high: '您的精神变态特质较高，表明您可能在情感反应和冲动控制方面存在困难。'
            }
        };

        function getLevel(score) {
            if (score < 33) return 'low';
            if (score < 66) return 'medium';
            return 'high';
        }

        function getDimensionChineseName(dimensionKey) {
            const names = {
                'machiavellianism': '马基雅维利主义',
                'narcissism': '自恋',
                'psychopathy': '精神变态'
            };
            return names[dimensionKey] || dimensionKey;
        }

        function getLevelText(level) {
            const levelTexts = {
                'low': '较低',
                'medium': '中等',
                'high': '较高'
            };
            return levelTexts[level] || '未知';
        }

        function getSuggestions(dimensionKey, level, score) {
            const suggestions = {
                machiavellianism: {
                    low: ['继续保持你的正直和诚实品质', '在团队合作中发挥你的可信度'],
                    medium: ['在保持策略性思维的同时，注意道德底线', '学会在诚实和策略之间找到平衡'],
                    high: ['反思自己的行为对他人的影响', '学习建立基于信任的人际关系']
                },
                narcissism: {
                    low: ['适当提升自信，认识到自己的价值和成就', '学会在适当的时候表达自己的想法'],
                    medium: ['保持现有的健康自信水平', '继续发展自己的优势和能力'],
                    high: ['学习谦逊和感恩的态度', '关注他人的需求和感受，培养同理心']
                },
                psychopathy: {
                    low: ['继续保持你的善良和同理心', '在人际关系中发挥你的情感敏感度'],
                    medium: ['在理性和情感之间找到更好的平衡', '学会识别和管理自己的冲动情绪'],
                    high: ['认真考虑寻求专业心理健康支持', '学习识别和理解自己及他人的情绪']
                }
            };
            return suggestions[dimensionKey][level] || [];
        }

        // 当前逻辑（有问题的版本）
        function updateDimensionUICurrent(dimensionKey, dimensionName, elementIdPrefix = null) {
            const prefix = elementIdPrefix || dimensionKey;
            const kebabCasePrefix = prefix.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
            const scoreElement = document.getElementById(`${kebabCasePrefix}-score`);
            const barElement = document.getElementById(`${kebabCasePrefix}-bar`);
            const analysisElement = document.getElementById(`${kebabCasePrefix}-analysis`);
            
            let result = `尝试查找元素: ${kebabCasePrefix}-score, ${kebabCasePrefix}-bar, ${kebabCasePrefix}-analysis<br>`;
            result += `找到元素: score=${!!scoreElement}, bar=${!!barElement}, analysis=${!!analysisElement}<br>`;
            
            if (scoreElement && barElement && analysisElement) {
                const score = userScores[dimensionKey];
                scoreElement.textContent = `${score}%`;
                barElement.style.width = `${score}%`;
                
                const level = getLevel(score);
                analysisElement.textContent = analysisTexts[dimensionKey][level];
                
                result += `<span class="success">✓ 基本元素更新成功 - ${dimensionName}: ${score}%</span><br>`;
                
                if (dimensionKey === 'machiavellianism' || dimensionKey === 'narcissism' || dimensionKey === 'psychopathy') {
                    updateDetailedAnalysisCurrent(dimensionKey, score, level);
                }
            } else {
                result += `<span class="error">✗ 基本元素未找到 - ${dimensionName}</span><br>`;
            }
            
            return result;
        }

        function updateDetailedAnalysisCurrent(dimensionKey, score, level) {
            const percentageTextElement = document.getElementById(`${dimensionKey}-detail-percentage-text`);
            const suggestionsElement = document.getElementById(`${dimensionKey}-detail-suggestions`);
            
            let result = `详细分析 - 尝试查找: ${dimensionKey}-detail-percentage-text, ${dimensionKey}-detail-suggestions<br>`;
            result += `找到元素: text=${!!percentageTextElement}, suggestions=${!!suggestionsElement}<br>`;
            
            if (percentageTextElement && suggestionsElement) {
                percentageTextElement.textContent = `您的${getDimensionChineseName(dimensionKey)}得分为${score}%，属于${getLevelText(level)}水平。`;
                
                const suggestions = getSuggestions(dimensionKey, level, score);
                suggestionsElement.innerHTML = suggestions.map(suggestion => `<li>${suggestion}</li>`).join('');
                
                result += `<span class="success">✓ 详细分析更新成功</span><br>`;
            } else {
                result += `<span class="error">✗ 详细分析元素未找到</span><br>`;
            }
            
            document.getElementById('test-results').innerHTML += result;
        }

        // 修复逻辑
        function updateDimensionUIFixed(dimensionKey, dimensionName, elementIdPrefix = null) {
            const prefix = elementIdPrefix || dimensionKey;
            const kebabCasePrefix = prefix.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
            const scoreElement = document.getElementById(`${kebabCasePrefix}-score`);
            const barElement = document.getElementById(`${kebabCasePrefix}-bar`);
            const analysisElement = document.getElementById(`${kebabCasePrefix}-analysis`);
            
            let result = `修复逻辑 - 尝试查找: ${kebabCasePrefix}-score, ${kebabCasePrefix}-bar, ${kebabCasePrefix}-analysis<br>`;
            result += `找到元素: score=${!!scoreElement}, bar=${!!barElement}, analysis=${!!analysisElement}<br>`;
            
            if (scoreElement && barElement && analysisElement) {
                const score = userScores[dimensionKey];
                scoreElement.textContent = `${score}%`;
                barElement.style.width = `${score}%`;
                
                const level = getLevel(score);
                analysisElement.textContent = analysisTexts[dimensionKey][level];
                
                result += `<span class="success">✓ 基本元素更新成功 - ${dimensionName}: ${score}%</span><br>`;
                
                // 对于三大维度，额外更新详细分析
                if (dimensionKey === 'machiavellianism' || dimensionKey === 'narcissism' || dimensionKey === 'psychopathy') {
                    result += updateDetailedAnalysisFixed(dimensionKey, score, level);
                }
            } else {
                result += `<span class="error">✗ 基本元素未找到 - ${dimensionName}</span><br>`;
            }
            
            return result;
        }

        function updateDetailedAnalysisFixed(dimensionKey, score, level) {
            const percentageTextElement = document.getElementById(`${dimensionKey}-detail-percentage-text`);
            const suggestionsElement = document.getElementById(`${dimensionKey}-detail-suggestions`);
            
            let result = `详细分析 - 尝试查找: ${dimensionKey}-detail-percentage-text, ${dimensionKey}-detail-suggestions<br>`;
            result += `找到元素: text=${!!percentageTextElement}, suggestions=${!!suggestionsElement}<br>`;
            
            if (percentageTextElement && suggestionsElement) {
                percentageTextElement.textContent = `您的${getDimensionChineseName(dimensionKey)}得分为${score}%，属于${getLevelText(level)}水平。`;
                
                const suggestions = getSuggestions(dimensionKey, level, score);
                suggestionsElement.innerHTML = suggestions.map(suggestion => `<li>${suggestion}</li>`).join('');
                
                result += `<span class="success">✓ 详细分析更新成功</span><br>`;
            } else {
                result += `<span class="error">✗ 详细分析元素未找到</span><br>`;
            }
            
            return result;
        }

        function testCurrentLogic() {
            clearResults();
            let results = '<h3>当前逻辑测试结果：</h3>';
            
            // 模拟当前的调用方式
            results += updateDimensionUICurrent('machiavellianism', '马基雅维利主义');
            results += updateDimensionUICurrent('narcissism', '自恋');
            results += updateDimensionUICurrent('psychopathy', '精神变态');
            
            // 然后再次调用带-detail前缀的
            results += '<hr>';
            results += updateDimensionUICurrent('machiavellianism', '马基雅维利主义', 'machiavellianism-detail');
            results += updateDimensionUICurrent('narcissism', '自恋', 'narcissism-detail');
            results += updateDimensionUICurrent('psychopathy', '精神变态', 'psychopathy-detail');
            
            document.getElementById('test-results').innerHTML = results;
        }

        function testFixedLogic() {
            clearResults();
            let results = '<h3>修复逻辑测试结果：</h3>';
            
            // 直接调用带-detail前缀的版本
            results += updateDimensionUIFixed('machiavellianism', '马基雅维利主义', 'machiavellianism-detail');
            results += updateDimensionUIFixed('narcissism', '自恋', 'narcissism-detail');
            results += updateDimensionUIFixed('psychopathy', '精神变态', 'psychopathy-detail');
            
            document.getElementById('test-results').innerHTML = results;
        }

        function clearResults() {
            document.getElementById('test-results').innerHTML = '';
            
            // 重置所有显示元素
            const elements = [
                'machiavellianism-detail-score', 'machiavellianism-detail-bar', 'machiavellianism-detail-analysis',
                'machiavellianism-detail-percentage-text', 'machiavellianism-detail-suggestions',
                'narcissism-detail-score', 'narcissism-detail-bar', 'narcissism-detail-analysis',
                'narcissism-detail-percentage-text', 'narcissism-detail-suggestions',
                'psychopathy-detail-score', 'psychopathy-detail-bar', 'psychopathy-detail-analysis',
                'psychopathy-detail-percentage-text', 'psychopathy-detail-suggestions'
            ];
            
            elements.forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    if (id.includes('-bar')) {
                        element.style.width = '0%';
                    } else if (id.includes('-suggestions')) {
                        element.innerHTML = '';
                    } else {
                        element.textContent = '0%';
                    }
                }
            });
        }

        // 页面加载时显示初始状态
        window.onload = function() {
            clearResults();
        };
    </script>
</body>
</html>
