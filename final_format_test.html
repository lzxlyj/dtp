<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最终维度格式统一测试</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 20px; 
            background: #1a1a1a; 
            color: #e0e0e0; 
            line-height: 1.6;
        }
        .test-container { max-width: 1200px; margin: 0 auto; }
        .dimension { 
            margin: 15px 0; 
            padding: 15px; 
            border: 1px solid #333; 
            border-radius: 8px;
            background: #2a2a2a;
        }
        .dimension h3 { 
            color: #a78bfa; 
            margin-bottom: 10px;
            font-size: 16px;
        }
        .score-bar { 
            display: flex; 
            align-items: center; 
            margin: 10px 0;
            gap: 10px;
        }
        .score { font-weight: bold; color: #a78bfa; }
        .bar { 
            width: 200px; 
            height: 10px; 
            background: #333; 
            border-radius: 5px; 
            overflow: hidden;
        }
        .fill { 
            height: 100%; 
            background: linear-gradient(90deg, #a78bfa, #8b5cf6); 
            border-radius: 5px;
            transition: width 0.3s ease;
        }
        .analysis { 
            font-size: 14px; 
            line-height: 1.7; 
            margin-top: 12px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 5px;
            border-left: 3px solid #a78bfa;
        }
        .status { 
            padding: 4px 8px; 
            border-radius: 4px; 
            font-size: 12px;
            font-weight: bold;
        }
        .success { background: #28a745; color: white; }
        .error { background: #dc3545; color: white; }
        .warning { background: #ffc107; color: #000; }
        .summary { 
            margin-top: 30px; 
            padding: 20px; 
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .all-passed { background: linear-gradient(135deg, #28a745, #20c997); color: white; }
        .has-issues { background: linear-gradient(135deg, #dc3545, #fd7e14); color: white; }
        .format-check {
            margin: 5px 0;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧠 最终维度格式统一测试</h1>
        <p>此页面用于验证所有10个维度的分析格式是否完全统一，确保界面美感一致性。</p>
        
        <div id="test-results"></div>
    </div>

    <script>
        // 测试数据
        const testScores = {
            'self-interest': 75,
            'greed': 60,
            'machiavellianism-detail': 80,
            'moral-disengagement': 45,
            'narcissism-detail': 70,
            'psychological-entitlement': 55,
            'psychopathy-detail': 65,
            'sadism': 40,
            'self-centered': 50,
            'malevolence': 35
        };

        // 分析文本模板（符合统一格式）
        const analysisTexts = {
            'self-interest': '你的利己主义处于高水平（75%），这表明你在决策时倾向于优先考虑个人利益。这种特质在某些情况下有助于维护自身权益，但过度发展可能影响人际关系。',
            'greed': '你的贪婪处于中等水平（60%），这表明你对物质和资源有一定程度的渴望，但通常能够控制在合理范围内。',
            'machiavellianism-detail': '你的马基雅维利主义处于高水平（80%），这表明你在人际交往中倾向于使用策略和手段来达到目的。',
            'moral-disengagement': '你的道德推脱处于中等水平（45%），这表明你在某些情况下可能会为自己的不当行为寻找理由。',
            'narcissism-detail': '你的自恋处于高水平（70%），这表明你有较强的自我关注倾向，重视自我价值感。',
            'psychological-entitlement': '你的心理权利处于中等水平（55%），这表明你有一定程度的权利意识，但通常能够平衡个人与他人的需求。',
            'psychopathy-detail': '你的精神变态处于中等水平（65%），这表明你在某些情况下可能表现出冷漠和缺乏同情心。',
            'sadism': '你的施虐倾向处于中等水平（40%），这表明你在某些情况下可能从他人的痛苦中获得快感。',
            'self-centered': '你的自我为中心处于中等水平（50%），这表明你有一定程度的自我关注，但能够考虑他人的感受。',
            'malevolence': '你的恶毒倾向处于低水平（35%），这表明你通常不会主动伤害他人，具有较好的善意。'
        };

        // 维度名称映射
        const dimensionNames = {
            'self-interest': '利己主义',
            'greed': '贪婪',
            'machiavellianism-detail': '马基雅维利主义',
            'moral-disengagement': '道德推脱',
            'narcissism-detail': '自恋',
            'psychological-entitlement': '心理权利',
            'psychopathy-detail': '精神变态',
            'sadism': '施虐倾向',
            'self-centered': '自我为中心',
            'malevolence': '恶毒倾向'
        };

        function runFinalFormatTest() {
            const results = document.getElementById('test-results');
            let allPassed = true;
            let totalChecks = 0;
            let passedChecks = 0;

            Object.keys(testScores).forEach(dimensionId => {
                const score = testScores[dimensionId];
                const analysis = analysisTexts[dimensionId];
                const name = dimensionNames[dimensionId];
                
                // 运行格式检查
                const formatCheck = checkUnifiedFormat(analysis, dimensionId, score);
                totalChecks += formatCheck.total;
                passedChecks += formatCheck.passed;
                
                const dimensionDiv = document.createElement('div');
                dimensionDiv.className = 'dimension';
                dimensionDiv.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h3>${name}</h3>
                        <span class="status ${formatCheck.allPassed ? 'success' : 'error'}">
                            ${formatCheck.allPassed ? '✅ 通过' : '❌ 失败'}
                        </span>
                    </div>
                    <div class="score-bar">
                        <span class="score">${score}%</span>
                        <div class="bar">
                            <div class="fill" style="width: ${score}%"></div>
                        </div>
                    </div>
                    <div class="analysis">
                        <strong>📋 分析文本：</strong><br>
                        ${analysis}
                    </div>
                    <div class="format-check">
                        ${formatCheck.details.map(detail => `• ${detail}`).join('<br>')}
                    </div>
                `;
                
                results.appendChild(dimensionDiv);
                
                if (!formatCheck.allPassed) {
                    allPassed = false;
                }
            });

            // 总体结果
            const summary = document.createElement('div');
            summary.className = `summary ${allPassed ? 'all-passed' : 'has-issues'}`;
            summary.innerHTML = `
                <h2>🎯 最终测试结果：${allPassed ? '全部通过！' : '存在格式问题'}</h2>
                <p>✅ 检查通过：${passedChecks}/${totalChecks} (${Math.round(passedChecks/totalChecks*100)}%)</p>
                <p>${allPassed ? '🎉 所有10个维度的分析格式已完全统一，界面美感得到保障！' : '⚠️ 部分维度的格式需要进一步调整'}</p>
                <p style="margin-top: 15px; font-size: 14px; opacity: 0.9;">
                    统一格式标准："你的[维度]处于[水平]水平（百分比），......"
                </p>
            `;
            
            results.appendChild(summary);
        }

        function checkUnifiedFormat(text, dimensionId, score) {
            const checks = [];
            let passed = 0;
            const total = 4;

            // 1. 检查是否包含"你的XXX处于XXX水平（百分比）"格式
            const expectedPattern = /你的\S+处于\S+水平（\d+%）/;
            if (expectedPattern.test(text)) {
                checks.push('✅ 包含标准格式"你的XXX处于XXX水平（百分比）"');
                passed++;
            } else {
                checks.push('❌ 缺少标准格式"你的XXX处于XXX水平（百分比）"');
            }

            // 检查百分比是否与分数匹配
            const percentageMatch = text.match(/(\d+)%/);
            if (percentageMatch && parseInt(percentageMatch[1]) === score) {
                checks.push('✅ 百分比数值与分数匹配');
                passed++;
            } else {
                checks.push('❌ 百分比数值与分数不匹配');
            }

            // 3. 检查是否包含具体描述内容
            if (text.length >= 30 && text.includes('，')) {
                checks.push('✅ 包含具体描述内容');
                passed++;
            } else {
                checks.push('❌ 缺少具体描述内容');
            }

            // 4. 检查文本长度是否合理
            if (text.length >= 25 && text.length <= 200) {
                checks.push('✅ 文本长度合理');
                passed++;
            } else {
                checks.push('❌ 文本长度过短或过长');
            }

            return {
                allPassed: passed === total,
                passed: passed,
                total: total,
                details: checks
            };
        }

        // 运行最终测试
        runFinalFormatTest();
    </script>
</body>
</html>
