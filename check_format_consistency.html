<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>格式一致性检查 - 黑暗三角人格测试</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0A0A0A; color: #E0E0E0; }
        .bg-dark { background-color: #0A0A0A; }
        .bg-secondary { background-color: #1A1A1A; }
        .text-light { color: #E0E0E0; }
        .text-accent { color: #9333EA; }
        .border-primary { border-color: #9333EA; }
    </style>
</head>
<body class="min-h-screen bg-dark text-light">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8 text-center text-accent">10维度分析文本格式一致性检查</h1>
        
        <!-- 测试控制 -->
        <div class="bg-secondary p-6 rounded-lg mb-8">
            <h2 class="text-xl font-semibold mb-4">测试控制</h2>
            <div class="flex flex-wrap gap-4">
                <button onclick="testLowScores()" class="px-4 py-2 bg-purple-600 text-white rounded hover:bg-purple-700">测试低分数</button>
                <button onclick="testMediumScores()" class="px-4 py-2 bg-purple-600 text-white rounded hover:bg-purple-700">测试中分数</button>
                <button onclick="testHighScores()" class="px-4 py-2 bg-purple-600 text-white rounded hover:bg-purple-700">测试高分数</button>
                <button onclick="checkFormatConsistency()" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">检查格式一致性</button>
            </div>
        </div>

        <!-- 维度显示区域 -->
        <div id="dimensions-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- 动态生成维度卡片 -->
        </div>

        <!-- 检查结果 -->
        <div id="check-results" class="bg-secondary p-6 rounded-lg mt-8 hidden">
            <h2 class="text-xl font-semibold mb-4 text-accent">格式一致性检查结果</h2>
            <div id="results-content"></div>
        </div>
    </div>

    <script>
        // 分析文本数据
        const analysisTexts = {
            selfInterest: {
                low: "你的利己主义倾向处于较低水平（0-33%），表明你不太关注个人利益，更注重集体和他人的需求。你愿意为了更大的利益而牺牲个人利益，这种品质在团队合作和人际关系中非常宝贵。",
                medium: "你的利己主义倾向处于中等水平（34-66%），能够在个人利益和集体利益之间找到平衡。在大多数情况下，你会考虑他人的感受，但在必要时也会为自己争取合理的利益。",
                high: "你的利己主义倾向处于较高水平（67-100%），非常关注个人利益，倾向于优先考虑自己的需求和目标。这种特质可以帮助你在竞争激烈的环境中取得成功，但也可能影响你的人际关系和团队合作。"
            },
            greed: {
                low: "你的贪婪程度处于较低水平（0-33%），对物质财富和权力没有强烈的欲望，更注重精神层面的满足。你容易感到满足，不会过分追求不属于自己的东西。",
                medium: "你的贪婪程度处于中等水平（34-66%），对物质和权力有一定的追求，但能够控制在合理范围内。你明白努力工作的价值，也懂得适度享受生活。",
                high: "你的贪婪程度处于较高水平（67-100%），对物质财富和权力有强烈的渴望，总是想要更多。这种强烈的欲望可以成为你前进的动力，但也可能导致你忽视其他重要的生活领域。"
            },
            machiavellianism: {
                low: "你的马基雅维利主义处于较低水平（0-33%），是一个非常正直和诚实的人，不屑于使用操纵或欺骗的手段来达到目的。你相信真诚和公平是处理人际关系的最佳方式，在工作和生活中倾向于直接表达自己的想法，不会刻意隐藏真实意图或玩弄心计。",
                medium: "你的马基雅维利主义处于中等水平（34-66%），能够在策略性思维和道德原则之间找到平衡。在某些情况下你会使用策略性思维来达到目的，但不会越过道德底线，能够根据不同的情况调整自己的行为方式，在需要时展现出一定的外交手腕。",
                high: "你的马基雅维利主义处于较高水平（67-100%），非常善于策略性思考和操纵他人，为了达到目的可以不择手段。你能够敏锐地观察他人的弱点，并巧妙地加以利用，在处理复杂情况时往往能够制定出精妙的策略，善于隐藏自己的真实意图。"
            },
            moralDisengagement: {
                low: "你的道德脱离程度处于较低水平（0-33%），有非常强烈的道德感和责任感，严格遵守自己的道德准则。即使在困难的情况下，你也不会轻易妥协自己的道德原则。",
                medium: "你的道德脱离程度处于中等水平（34-66%），有基本的道德准则，但在某些情况下会灵活处理。你能够理解不同情况下的道德复杂性，并做出相应的判断。",
                high: "你的道德脱离程度处于较高水平（67-100%），经常为自己的不道德行为寻找借口，能够轻易地为自己的行为辩护。你认为道德规则是相对的，可以根据具体情况灵活解释。"
            },
            narcissism: {
                low: "你的自恋处于较低水平（0-33%），是一个非常谦虚和低调的人，不太关注自己的成就和优点。你更倾向于看到他人的价值和贡献，而不是强调自己的重要性，通常对自己的能力有清醒的认识。",
                medium: "你的自恋处于中等水平（34-66%），对自己有合理的自信，能够认识到自己的优点和不足。你在适当的时候会表现自己，但不会过分炫耀或自大，能够在自我肯定和谦逊之间找到合适的平衡点。",
                high: "你的自恋处于较高水平（67-100%），非常自信，甚至有些自负，总是希望成为关注的焦点。你相信自己比他人更优秀，应该得到特殊的待遇和认可，渴望成为众人瞩目的中心，享受被赞美和崇拜的感觉。"
            },
            psychologicalEntitlement: {
                low: "你的心理权利感处于较低水平（0-33%），不认为自己应该得到特殊的待遇，相信每个人都应该平等地努力和付出。你不会轻易要求他人为你提供便利或特殊照顾。",
                medium: "你的心理权利感处于中等水平（34-66%），认为自己在某些情况下应该得到合理的特殊待遇，特别是当你付出了额外的努力或具有特殊的能力时。",
                high: "你的心理权利感处于较高水平（67-100%），强烈认为自己应该得到特殊的待遇和尊重，无论自己的实际表现如何。你经常要求他人为你提供便利，而不考虑他人的感受。"
            },
            psychopathy: {
                low: "你的精神病态处于较低水平（0-33%），非常重视他人的感受和福祉，总是尽量避免伤害他人。你有强烈的同理心和责任感，是一个非常善良和体贴的人，能够深刻地感受到他人的情绪和痛苦。",
                medium: "你的精神病态处于中等水平（34-66%），在大多数情况下能够控制自己的冲动和行为，但在某些情况下也可能表现出冷漠或冲动的一面。你能够理解他人的感受，但有时也会优先考虑自己的需求，能够在理性和感性之间找到平衡。",
                high: "你的精神病态处于较高水平（67-100%），经常表现出冷漠、冲动和不负责任的行为，不太关心他人的感受和福祉。你能够轻易地伤害他人而不感到内疚，经常违反社会规则和道德准则，倾向于追求即时的满足和刺激。"
            },
            sadism: {
                low: "你的虐待倾向处于较低水平（0-33%），非常善良和富有同情心，看到他人受苦会感到难过。你总是尽量帮助他人，避免伤害任何有生命的东西。",
                medium: "你的虐待倾向处于中等水平（34-66%），在大多数情况下能够同情他人的痛苦，但在某些情况下也可能感到一丝幸灾乐祸。你不会主动伤害他人，但也可能不会积极地帮助处于困境中的人。",
                high: "你的虐待倾向处于较高水平（67-100%），喜欢看到他人受苦，甚至会主动制造痛苦来满足自己的快感。你对他人的痛苦缺乏同情心，反而从中获得乐趣。"
            },
            selfCentered: {
                low: "你的自我中心程度处于较低水平（0-33%），非常关注他人的需求和感受，总是优先考虑他人的利益。你是一个非常无私和体贴的人，愿意为他人付出很多。",
                medium: "你的自我中心程度处于中等水平（34-66%），能够在关注自己和关注他人之间找到平衡。你会考虑他人的感受，但也不会忽视自己的需求和利益。",
                high: "你的自我中心程度处于较高水平（67-100%），总是优先考虑自己的需求和感受，很少关心他人的想法。你认为自己的需求比他人的更重要，经常将自己的意愿强加给他人。"
            },
            malevolence: {
                low: "你的恶意程度处于较低水平（0-33%），是一个非常善良和友善的人，总是尽量帮助他人，避免与他人发生冲突。你相信人性本善，愿意相信他人的善意。",
                medium: "你的恶意程度处于中等水平（34-66%），在大多数情况下是善良和友善的，但也可能在受到伤害或挑衅时表现出一定的恶意。你能够控制自己的负面情绪，但也不会轻易忘记他人的过错。",
                high: "你的恶意程度处于较高水平（67-100%），经常表现出恶意和敌意，喜欢看到他人失败和痛苦。你可能会主动伤害他人，或者在他人遇到困难时幸灾乐祸。"
            }
        };

        // 维度中文名称映射
        const dimensionNames = {
            selfInterest: "利己主义",
            greed: "贪婪",
            machiavellianism: "马基雅维利主义",
            moralDisengagement: "道德推脱",
            narcissism: "自恋",
            psychologicalEntitlement: "心理权利",
            psychopathy: "精神变态",
            sadism: "施虐倾向",
            selfCentered: "自我为中心",
            malevolence: "恶毒倾向"
        };

        // 初始化页面
        function initPage() {
            const container = document.getElementById('dimensions-container');
            container.innerHTML = '';

            Object.keys(analysisTexts).forEach(dimensionKey => {
                const card = document.createElement('div');
                card.className = 'bg-secondary p-6 rounded-lg';
                card.innerHTML = `
                    <h3 class="text-lg font-semibold mb-4 text-accent">${dimensionNames[dimensionKey]}</h3>
                    <div class="space-y-3">
                        <div class="border border-green-600 p-3 rounded">
                            <div class="text-sm font-medium text-green-400 mb-1">低水平 (0-33%)</div>
                            <div id="${dimensionKey}-low" class="text-sm text-gray-300">点击测试按钮查看文本</div>
                        </div>
                        <div class="border border-yellow-600 p-3 rounded">
                            <div class="text-sm font-medium text-yellow-400 mb-1">中等水平 (34-66%)</div>
                            <div id="${dimensionKey}-medium" class="text-sm text-gray-300">点击测试按钮查看文本</div>
                        </div>
                        <div class="border border-red-600 p-3 rounded">
                            <div class="text-sm font-medium text-red-400 mb-1">高水平 (67-100%)</div>
                            <div id="${dimensionKey}-high" class="text-sm text-gray-300">点击测试按钮查看文本</div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 测试低分数
        function testLowScores() {
            Object.keys(analysisTexts).forEach(dimensionKey => {
                document.getElementById(`${dimensionKey}-low`).textContent = analysisTexts[dimensionKey].low;
            });
        }

        // 测试中分数
        function testMediumScores() {
            Object.keys(analysisTexts).forEach(dimensionKey => {
                document.getElementById(`${dimensionKey}-medium`).textContent = analysisTexts[dimensionKey].medium;
            });
        }

        // 测试高分数
        function testHighScores() {
            Object.keys(analysisTexts).forEach(dimensionKey => {
                document.getElementById(`${dimensionKey}-high`).textContent = analysisTexts[dimensionKey].high;
            });
        }

        // 检查格式一致性
        function checkFormatConsistency() {
            const results = [];
            
            Object.keys(analysisTexts).forEach(dimensionKey => {
                const texts = analysisTexts[dimensionKey];
                const dimensionResult = {
                    dimension: dimensionNames[dimensionKey],
                    key: dimensionKey,
                    issues: []
                };

                // 检查每个等级的格式
                ['low', 'medium', 'high'].forEach(level => {
                    const text = texts[level];
                    
                    // 检查是否包含分数范围
                    const hasScoreRange = text.includes('（') && text.includes('）') && 
                                        (text.includes('0-33%') || text.includes('34-66%') || text.includes('67-100%'));
                    
                    if (!hasScoreRange) {
                        dimensionResult.issues.push(`${level}: 缺少分数范围标识`);
                    }

                    // 检查是否以"你的"开头
                    if (!text.startsWith('你的')) {
                        dimensionResult.issues.push(`${level}: 未以"你的"开头`);
                    }

                    // 检查文本长度（应该相对一致）
                    const textLength = text.length;
                    if (textLength < 50 || textLength > 300) {
                        dimensionResult.issues.push(`${level}: 文本长度异常 (${textLength}字符)`);
                    }
                });

                results.push(dimensionResult);
            });

            // 显示结果
            displayResults(results);
        }

        // 显示检查结果
        function displayResults(results) {
            const resultsContainer = document.getElementById('check-results');
            const contentContainer = document.getElementById('results-content');
            
            resultsContainer.classList.remove('hidden');
            
            let html = '';
            let totalIssues = 0;

            results.forEach(result => {
                const hasIssues = result.issues.length > 0;
                totalIssues += result.issues.length;
                
                html += `
                    <div class="mb-4 p-4 rounded-lg ${hasIssues ? 'bg-red-900 bg-opacity-30 border border-red-600' : 'bg-green-900 bg-opacity-30 border border-green-600'}">
                        <h3 class="font-semibold ${hasIssues ? 'text-red-400' : 'text-green-400'}">
                            ${result.dimension} ${hasIssues ? '❌' : '✅'}
                        </h3>
                        ${hasIssues ? 
                            `<ul class="mt-2 text-sm text-red-300">
                                ${result.issues.map(issue => `<li>• ${issue}</li>`).join('')}
                            </ul>` :
                            `<p class="mt-2 text-sm text-green-300">格式正确，无异常</p>`
                        }
                    </div>
                `;
            });

            html = `
                <div class="mb-4">
                    <div class="text-lg font-semibold ${totalIssues > 0 ? 'text-red-400' : 'text-green-400'}">
                        总计发现问题: ${totalIssues} 个
                    </div>
                    <div class="text-sm text-gray-400 mt-1">
                        检查维度: ${results.length} 个，每个维度包含 3 个等级文本
                    </div>
                </div>
                ${html}
            `;

            contentContainer.innerHTML = html;
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>
</html>
