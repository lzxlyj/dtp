<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>详细维度分析修复验证</title>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        h1 {
            text-align: center;
            color: #9d4edd;
            margin-bottom: 30px;
        }
        .test-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .dimension-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .dimension-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .dimension-card h3 {
            margin-top: 0;
            color: #c77dff;
        }
        .score-display {
            font-size: 18px;
            font-weight: bold;
            color: #9d4edd;
            margin: 10px 0;
        }
        .bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin: 10px 0;
        }
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #9d4edd, #c77dff);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .analysis-text {
            font-size: 14px;
            color: #dee2e6;
            margin-top: 10px;
            line-height: 1.4;
        }
        .test-button {
            background: linear-gradient(90deg, #9d4edd, #c77dff);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
            transition: transform 0.2s ease;
        }
        .test-button:hover {
            transform: translateY(-2px);
        }
        .status {
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
            font-weight: bold;
        }
        .success {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid rgba(40, 167, 69, 0.5);
            color: #28a745;
        }
        .error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.5);
            color: #dc3545;
        }
        .warning {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid rgba(255, 193, 7, 0.5);
            color: #ffc107;
        }
        .console-output {
            background: rgba(0, 0, 0, 0.7);
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 12px;
            border: 1px solid rgba(0, 255, 0, 0.3);
        }
        .validation-result {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        .result-item {
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
        }
        .result-item.success {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid rgba(40, 167, 69, 0.5);
            color: #28a745;
        }
        .result-item.error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.5);
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 详细维度分析修复验证</h1>
        
        <div class="test-section">
            <h2>修复概述</h2>
            <p>此页面用于验证详细维度分析修复效果。主要修复了以下问题：</p>
            <ul>
                <li>✅ 修复了JavaScript中驼峰式命名到连字符命名的转换逻辑</li>
                <li>✅ 添加了特殊复合词处理（如moralDisengagement → moral-disengagement）</li>
                <li>✅ 确保所有详细维度分析的分数、进度条和分析文本正确显示</li>
            </ul>
        </div>
        
        <div class="test-section">
            <h2>测试控制</h2>
            <div style="text-align: center;">
                <button class="test-button" onclick="runFullTest()">运行完整测试</button>
                <button class="test-button" onclick="testElementMapping()">测试元素映射</button>
                <button class="test-button" onclick="testScoreUpdate()">测试分数更新</button>
                <button class="test-button" onclick="clearResults()">清除结果</button>
                <button class="test-button" onclick="toggleConsole()">切换控制台输出</button>
            </div>
        </div>
        
        <div id="test-status"></div>
        <div id="validation-results"></div>
        
        <div class="test-section">
            <h2>详细维度分析展示</h2>
            <div class="dimension-grid" id="dimensions-grid">
                <!-- 维度卡片将通过JavaScript动态生成 -->
            </div>
        </div>
        
        <div id="console-output" class="console-output" style="display: none;">
            <strong>控制台输出：</strong>
            <div id="console-content"></div>
        </div>
    </div>

    <script src="optimized_scoring.js"></script>
    <script>
        // 控制台输出捕获
        let consoleLogs = [];
        const originalConsoleLog = console.log;
        console.log = function(...args) {
            const message = args.join(' ');
            consoleLogs.push(message);
            originalConsoleLog.apply(console, args);
            updateConsoleDisplay();
        };

        // 测试数据
        const testScores = {
            selfInterest: 45,
            greed: 30,
            machiavellianism: 60,
            moralDisengagement: 25,
            narcissism: 55,
            psychologicalEntitlement: 40,
            psychopathy: 35,
            sadism: 20,
            selfCentered: 50,
            malevolence: 15
        };

        // 维度配置
        const dimensions = [
            {key: 'selfInterest', name: '利己主义', chinese: '利己主义'},
            {key: 'greed', name: '贪婪', chinese: '贪婪'},
            {key: 'machiavellianism', name: '马基雅维利主义', chinese: '马基雅维利主义'},
            {key: 'moralDisengagement', name: '道德推脱', chinese: '道德推脱'},
            {key: 'narcissism', name: '自恋', chinese: '自恋'},
            {key: 'psychologicalEntitlement', name: '心理权利', chinese: '心理权利'},
            {key: 'psychopathy', name: '精神变态', chinese: '精神变态'},
            {key: 'sadism', name: '施虐倾向', chinese: '施虐倾向'},
            {key: 'selfCentered', name: '自我为中心', chinese: '自我为中心'},
            {key: 'malevolence', name: '恶毒倾向', chinese: '恶毒倾向'}
        ];

        // 初始化页面
        function initializePage() {
            generateDimensionCards();
            updateStatus('准备就绪，点击按钮开始测试', 'success');
        }

        // 生成维度卡片
        function generateDimensionCards() {
            const grid = document.getElementById('dimensions-grid');
            grid.innerHTML = '';
            
            dimensions.forEach(dim => {
                const elementId = getElementId(dim.key);
                const card = document.createElement('div');
                card.className = 'dimension-card';
                card.innerHTML = `
                    <h3>${dim.name}</h3>
                    <div class="score-display" id="${elementId}-score">0%</div>
                    <div class="bar-container">
                        <div class="bar-fill" id="${elementId}-bar" style="width: 0%"></div>
                    </div>
                    <div class="analysis-text" id="${elementId}-analysis">等待测试...</div>
                `;
                grid.appendChild(card);
            });
        }

        // 获取元素ID（修复后的逻辑）
        function getElementId(dimensionKey) {
            const specialCases = {
                'moralDisengagement': 'moral-disengagement',
                'psychologicalEntitlement': 'psychological-entitlement',
                'selfInterest': 'self-interest',
                'selfCentered': 'self-centered'
            };
            
            if (specialCases[dimensionKey]) {
                return specialCases[dimensionKey];
            }
            
            return dimensionKey.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
        }

        // 运行完整测试
        function runFullTest() {
            console.log('=== 开始完整测试 ===');
            updateStatus('正在运行完整测试...', 'warning');
            
            // 设置测试分数
            Object.assign(userScores, testScores);
            
            // 调用updateDimensionUI函数
            dimensions.forEach(dim => {
                try {
                    updateDimensionUI(dim.key, dim.chinese);
                } catch (error) {
                    console.error(`更新 ${dim.name} 时出错:`, error);
                }
            });
            
            // 验证结果
            setTimeout(() => {
                const results = validateResults();
                displayValidationResults(results);
                
                const successRate = (results.filter(r => r.success).length / results.length * 100).toFixed(1);
                const statusClass = successRate >= 90 ? 'success' : successRate >= 70 ? 'warning' : 'error';
                updateStatus(`测试完成: ${results.filter(r => r.success).length}/${results.length} 通过 (${successRate}%)`, statusClass);
                
                console.log(`=== 测试完成: ${successRate}% 通过率 ===`);
            }, 500);
        }

        // 测试元素映射
        function testElementMapping() {
            console.log('=== 测试元素ID映射 ===');
            updateStatus('正在测试元素映射...', 'warning');
            
            const results = [];
            dimensions.forEach(dim => {
                const elementId = getElementId(dim.key);
                const scoreEl = document.getElementById(elementId + '-score');
                const barEl = document.getElementById(elementId + '-bar');
                const analysisEl = document.getElementById(elementId + '-analysis');
                
                const success = scoreEl && barEl && analysisEl;
                results.push({
                    dimension: dim.name,
                    elementId: elementId,
                    success: success,
                    details: `分数元素: ${scoreEl ? '✅' : '❌'}, 进度条: ${barEl ? '✅' : '❌'}, 分析: ${analysisEl ? '✅' : '❌'}`
                });
                
                console.log(`${dim.name} (${elementId}): ${success ? '✅ 找到所有元素' : '❌ 缺少元素'}`);
            });
            
            displayValidationResults(results);
            const successCount = results.filter(r => r.success).length;
            const statusClass = successCount === dimensions.length ? 'success' : 'error';
            updateStatus(`元素映射测试: ${successCount}/${dimensions.length} 通过`, statusClass);
        }

        // 测试分数更新
        function testScoreUpdate() {
            console.log('=== 测试分数更新 ===');
            updateStatus('正在测试分数更新...', 'warning');
            
            // 设置测试分数
            Object.assign(userScores, testScores);
            
            // 更新所有维度
            dimensions.forEach(dim => {
                updateDimensionUI(dim.key, dim.chinese);
            });
            
            setTimeout(() => {
                const results = [];
                dimensions.forEach(dim => {
                    const elementId = getElementId(dim.key);
                    const scoreEl = document.getElementById(elementId + '-score');
                    const barEl = document.getElementById(elementId + '-bar');
                    const analysisEl = document.getElementById(elementId + '-analysis');
                    
                    const expectedScore = testScores[dim.key] + '%';
                    const expectedWidth = testScores[dim.key] + '%';
                    const expectedAnalysis = getAnalysisText(dim.key, testScores[dim.key]);
                    
                    const scoreOk = scoreEl && scoreEl.textContent === expectedScore;
                    const barOk = barEl && barEl.style.width === expectedWidth;
                    const analysisOk = analysisEl && analysisEl.textContent === expectedAnalysis;
                    
                    const success = scoreOk && barOk && analysisOk;
                    
                    results.push({
                        dimension: dim.name,
                        success: success,
                        details: `分数: ${scoreOk ? '✅' : '❌'}, 进度条: ${barOk ? '✅' : '❌'}, 分析: ${analysisOk ? '✅' : '❌'}`
                    });
                    
                    console.log(`${dim.name}: ${success ? '✅ 更新成功' : '❌ 更新失败'}`);
                });
                
                displayValidationResults(results);
                const successCount = results.filter(r => r.success).length;
                const successRate = (successCount / dimensions.length * 100).toFixed(1);
                const statusClass = successRate >= 90 ? 'success' : successRate >= 70 ? 'warning' : 'error';
                updateStatus(`分数更新测试: ${successCount}/${dimensions.length} 通过 (${successRate}%)`, statusClass);
            }, 300);
        }

        // 获取分析文本
        function getAnalysisText(dimensionKey, score) {
            const level = getLevel(score);
            return analysisTexts[dimensionKey][level];
        }

        // 验证结果
        function validateResults() {
            const results = [];
            dimensions.forEach(dim => {
                const elementId = getElementId(dim.key);
                const scoreEl = document.getElementById(elementId + '-score');
                const barEl = document.getElementById(elementId + '-bar');
                const analysisEl = document.getElementById(elementId + '-analysis');
                
                const expectedScore = testScores[dim.key] + '%';
                const expectedWidth = testScores[dim.key] + '%';
                const expectedAnalysis = getAnalysisText(dim.key, testScores[dim.key]);
                
                const scoreOk = scoreEl && scoreEl.textContent === expectedScore;
                const barOk = barEl && barEl.style.width === expectedWidth;
                const analysisOk = analysisEl && analysisEl.textContent === expectedAnalysis;
                
                results.push({
                    dimension: dim.name,
                    elementId: elementId,
                    success: scoreOk && barOk && analysisOk,
                    scoreOk: scoreOk,
                    barOk: barOk,
                    analysisOk: analysisOk,
                    details: `分数: ${scoreOk ? '✅' : '❌'}, 进度条: ${barOk ? '✅' : '❌'}, 分析: ${analysisOk ? '✅' : '❌'}`
                });
            });
            return results;
        }

        // 显示验证结果
        function displayValidationResults(results) {
            const container = document.getElementById('validation-results');
            const successCount = results.filter(r => r.success).length;
            const totalCount = results.length;
            
            let html = `
                <div class="test-section">
                    <h3>验证结果 (${successCount}/${totalCount})</h3>
                    <div class="validation-result">
            `;
            
            results.forEach(result => {
                const statusClass = result.success ? 'success' : 'error';
                html += `
                    <div class="result-item ${statusClass}">
                        <div>${result.dimension}</div>
                        <div>${result.success ? '✅ 通过' : '❌ 失败'}</div>
                        <div style="font-size: 12px; margin-top: 5px;">${result.details || ''}</div>
                    </div>
                `;
            });
            
            html += '</div></div>';
            container.innerHTML = html;
        }

        // 更新状态
        function updateStatus(message, type) {
            const statusEl = document.getElementById('test-status');
            statusEl.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        // 清除结果
        function clearResults() {
            consoleLogs = [];
            document.getElementById('validation-results').innerHTML = '';
            document.getElementById('test-status').innerHTML = '';
            document.getElementById('console-output').style.display = 'none';
            
            // 重置维度显示
            dimensions.forEach(dim => {
                const elementId = getElementId(dim.key);
                const scoreEl = document.getElementById(elementId + '-score');
                const barEl = document.getElementById(elementId + '-bar');
                const analysisEl = document.getElementById(elementId + '-analysis');
                
                if (scoreEl) scoreEl.textContent = '0%';
                if (barEl) barEl.style.width = '0%';
                if (analysisEl) analysisEl.textContent = '等待测试...';
            });
            
            updateStatus('结果已清除', 'success');
        }

        // 切换控制台显示
        function toggleConsole() {
            const consoleEl = document.getElementById('console-output');
            consoleEl.style.display = consoleEl.style.display === 'none' ? 'block' : 'none';
        }

        // 更新控制台显示
        function updateConsoleDisplay() {
            const contentEl = document.getElementById('console-content');
            contentEl.innerHTML = consoleLogs.join('<br>');
        }

        // 页面加载完成后初始化
        window.addEventListener('load', function() {
            setTimeout(initializePage, 500);
        });
    </script>
</body>
</html>
