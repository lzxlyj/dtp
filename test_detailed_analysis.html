<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>详细分析功能测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .result { margin: 10px 0; padding: 10px; background: #f5f5f5; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>详细分析功能测试</h1>
    
    <div class="test-section">
        <h2>测试详细分析功能</h2>
        <button onclick="testDetailedAnalysis()">测试详细分析</button>
        <div id="test-results"></div>
    </div>

    <!-- 模拟HTML结构 -->
    <div style="display: none;">
        <!-- 马基雅维利主义 -->
        <span id="machiavellianism-percentage-text"></span>
        <ul id="machiavellianism-suggestions"></ul>
        
        <!-- 自恋 -->
        <span id="narcissism-percentage-text"></span>
        <ul id="narcissism-suggestions"></ul>
        
        <!-- 精神变态 -->
        <span id="psychopathy-percentage-text"></span>
        <ul id="psychopathy-suggestions"></ul>
    </div>

    <script>
        // 复制相关的JavaScript函数
        function getDimensionChineseName(dimensionKey) {
            const names = {
                'machiavellianism': '马基雅维利主义',
                'narcissism': '自恋',
                'psychopathy': '精神变态'
            };
            return names[dimensionKey] || dimensionKey;
        }
        
        function getLevelText(level) {
            const levelTexts = {
                'low': '较低',
                'medium': '中等',
                'high': '较高'
            };
            return levelTexts[level] || '未知';
        }
        
        function getSuggestions(dimensionKey, level, score) {
            const suggestions = {
                machiavellianism: {
                    low: ['继续保持你的正直和诚实品质', '在团队合作中发挥你的可信度'],
                    medium: ['在保持策略性思维的同时，注意道德底线', '学会在诚实和策略之间找到平衡'],
                    high: ['反思自己的行为对他人的影响', '学习建立基于信任的人际关系']
                },
                narcissism: {
                    low: ['适当提升自信，认识到自己的价值和成就', '学会在适当的时候表达自己的想法'],
                    medium: ['保持现有的健康自信水平', '继续发展自己的优势和能力'],
                    high: ['学习谦逊和感恩的态度', '关注他人的需求和感受，培养同理心']
                },
                psychopathy: {
                    low: ['继续保持你的善良和同理心', '在人际关系中发挥你的情感敏感度'],
                    medium: ['在理性和情感之间找到更好的平衡', '学会识别和管理自己的冲动情绪'],
                    high: ['认真考虑寻求专业心理健康支持', '学习识别和理解自己及他人的情绪']
                }
            };
            
            return suggestions[dimensionKey][level] || [];
        }
        
        function updateDetailedAnalysis(dimensionKey, score, level) {
            const percentageTextElement = document.getElementById(`${dimensionKey}-percentage-text`);
            const suggestionsElement = document.getElementById(`${dimensionKey}-suggestions`);
            
            const resultsDiv = document.getElementById('test-results');
            
            if (percentageTextElement && suggestionsElement) {
                // 设置百分比文本
                percentageTextElement.textContent = `您的${getDimensionChineseName(dimensionKey)}得分为${score}%，属于${getLevelText(level)}水平。`;
                
                // 设置建议内容
                const suggestions = getSuggestions(dimensionKey, level, score);
                suggestionsElement.innerHTML = suggestions.map(suggestion => `<li>${suggestion}</li>`).join('');
                
                resultsDiv.innerHTML += `
                    <div class="result success">
                        <strong>${getDimensionChineseName(dimensionKey)} (${dimensionKey})</strong><br>
                        分数: ${score}%<br>
                        等级: ${getLevelText(level)}<br>
                        百分比文本: ${percentageTextElement.textContent}<br>
                        建议数量: ${suggestions.length}
                    </div>
                `;
            } else {
                resultsDiv.innerHTML += `
                    <div class="result error">
                        <strong>${getDimensionChineseName(dimensionKey)} (${dimensionKey})</strong><br>
                        <span class="error">错误: 找不到元素</span><br>
                        percentageTextElement: ${percentageTextElement}<br>
                        suggestionsElement: ${suggestionsElement}
                    </div>
                `;
            }
        }
        
        function testDetailedAnalysis() {
            document.getElementById('test-results').innerHTML = '';
            
            // 测试不同分数和等级
            updateDetailedAnalysis('machiavellianism', 25, 'low');
            updateDetailedAnalysis('narcissism', 55, 'medium');
            updateDetailedAnalysis('psychopathy', 85, 'high');
        }
        
        // 页面加载时自动测试
        window.onload = function() {
            testDetailedAnalysis();
        };
    </script>
</body>
</html>
